<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Curator's Vault</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">VAULT</div>
            <h2>Welcome Back</h2>
            <p>Sign in to your private collection.</p>
        </div>
        <form class="auth-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="curator@art.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <a href="{% url 'home' %}"class="btn-primary">Enter Vault</a>
        </form>
        <p class="auth-footer">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
</body>
</html>
